<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FoodWagon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"/>

    <link rel="stylesheet" href="style.css" />

  </head>
  <body>
    <header class="header">
      <nav class="nav container">
        <div class="logo">
          <img src="images/Logo.png" alt="Foodwagon" />
        </div>
        <div class="location">
          <span>Deliver to</span>
          <i class="icons-nav fa-solid fa-location-dot"></i>
          Current location
          <span>Mohammadpur Bus Stand, Dhaka</span>
        </div>
        <div class="nav-actions">
          <a href="#" class="search-link">
            <i class="icons-nav fa-solid fa-magnifying-glass"></i>
            <span>Search Food</span>
          </a>
          <button class="login-button">
            <i class="icons-nav fa-solid fa-user"></i>Login
          </button>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div>
          <div>
            <h1>Are you starving?</h1>
            <p>Within a few clicks, find meals that are accessible near you</p>

            <div>
              <div>
                <button type="button">
                  <i class="fa-solid fa-motorcycle" aria-hidden="true"></i>
                  Delivery
                </button>
                <button type="button">
                  <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
                  Pickup
                </button>
              </div>
              <div>
                <div>
                  <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                  <span>Enter Your Address</span>
                </div>
                <button type="button">
                  <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                  Find Food
                </button>
              </div>
            </div>
          </div>

          <figure>
            <img src="images/Image.png" alt="A bowl of noodles topped with egg and vegetables">
          </figure>
        </div>
      </section>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
